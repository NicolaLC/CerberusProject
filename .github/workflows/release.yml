# Builds the web app and the desktop apps (Windows, macOS, Linux) and publishes them as a GitHub release
# tagged v<package.json version> (the tag is created on the built commit if it doesn't exist).
# Triggers: a merge (push) to main whose package.json version has no v<version> tag yet (bump the version to release),
# a pushed commit whose message contains [release], a pushed tag v<version>, or a manual run.
name: Release

on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  meta:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$V" ]]; then echo "tag $GITHUB_REF_NAME != v$V"; exit 1; fi
          GO=true
          # a plain merge to main releases only a new version: skip when v<version> is already tagged
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main && "$MSG" != *"[release]"* ]] \
            && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then
            echo "v$V already released: bump package.json version to release"; GO=false
          fi
          echo "go=$GO" >> "$GITHUB_OUTPUT"
        env:
          MSG: ${{ github.event.head_commit.message }}

  web:
    needs: meta
    if: needs.meta.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 } # node runs the test and build scripts
      - uses: oven-sh/setup-bun@v2 # bun installs and runs package scripts
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:browser
      - run: bun run build && bun run build:artifact
      - name: Package web build
        run: |
          V=$(node -p "require('./package.json').version")
          mkdir -p out
          (cd dist && zip -qr "../out/Cerberus-$V-web.zip" . -x 'artifact/*')
          cp dist/artifact/cerberus.html "out/Cerberus-$V-web-single-file.html"
      - uses: actions/upload-artifact@v4
        with: { name: web, path: out/* }

  desktop:
    needs: meta
    if: needs.meta.outputs.go == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 } # node runs the test and build scripts
      - uses: oven-sh/setup-bun@v2 # bun installs and runs package scripts
        with: { bun-version: 1.4.2 }
      - run: bun install --frozen-lockfile
      - name: Build installer
        run: bun run desktop:dist --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned builds (no certificates yet)
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error

  release:
    needs: [meta, web, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: assets, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.meta.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Cerberus v${{ needs.meta.outputs.version }}
          body_path: RELEASE_NOTES.md
          prerelease: true
          files: assets/*
